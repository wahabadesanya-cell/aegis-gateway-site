<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; form-action 'self' https://formsubmit.co; frame-src 'none'">
  <title>Page not found — Aegis Guard Gateway</title>
  <meta name="robots" content="noindex" />
  <meta name="description" content="That page does not exist on the Aegis Guard Gateway site." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:            #0A0A0C;
      --panel:          #131318;
      --border:         #29292F;
      --border-lit:     #3A3A44;
      --gold:           #C9A14A;
      --gold-bright:    #E4BF6E;
      --text-primary:   #F2EFE9;
      --text-secondary: #A8A29A;
      --text-muted:     #6B655D;
      --mono: 'SF Mono', 'Fira Code', 'Fira Mono', 'Cascadia Code', monospace;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --serif: 'Source Serif 4', Georgia, serif;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--ink);
      color: var(--text-primary);
      font-family: var(--sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .card { max-width: 620px; text-align: center; }
    .code {
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.24em;
      color: var(--gold);
      margin-bottom: 22px;
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(1.9rem, 5vw, 2.6rem);
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 14px;
    }
    .lead {
      color: var(--text-secondary);
      font-size: 1.02rem;
      margin-bottom: 34px;
    }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .links a {
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-decoration: none;
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 11px 20px;
      transition: border-color .25s var(--ease), color .25s var(--ease);
    }
    .links a:hover { border-color: var(--gold); color: var(--gold-bright); }
    .links a.primary { border-color: var(--gold); color: var(--gold-bright); }
    .rule {
      width: 42px;
      height: 1px;
      background: var(--border-lit);
      margin: 34px auto 0;
    }
    .foot {
      margin-top: 20px;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">ERROR 404 &middot; PAGE NOT FOUND</div>
    <h1>That page does not exist.</h1>
    <p class="lead">
      The address may have changed, or the link that brought you here is out of date.
      The pages below are current.
    </p>
    <div class="links">
      <a class="primary" href="/">Gateway home</a>
      <a href="/pricing.html">Pricing</a>
      <a href="https://adesanyaaiadvisory.com">Adesanya AI Advisory</a>
      <a href="mailto:abdulwahab@adesanyaaiadvisory.com">Contact</a>
    </div>
    <div class="rule"></div>
    <p class="foot">AEGIS GUARD GATEWAY</p>
  </main>
</body>
</html>
